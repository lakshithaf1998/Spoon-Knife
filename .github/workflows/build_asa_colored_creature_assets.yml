name: Build ASA Colored Creature Assets

on:
  push:
    paths:
      - '.github/workflows/build_asa_colored_creature_assets.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Build colored ASA creature pack
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/arkutils/species-images.git species-images
          cat > build_assets.py <<'PY'
          import colorsys
          import hashlib
          import io
          import json
          import math
          import re
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import quote

          import requests
          from PIL import Image, ImageEnhance, ImageOps, ImageStat

          ROOT = Path.cwd()
          SRC = ROOT / 'species-images' / 'images'
          OUT_ROOT = ROOT / 'lakwatch_creature_assets_colored'
          OUT = OUT_ROOT / 'creatures'
          OUT.mkdir(parents=True, exist_ok=True)
          API = 'https://ark.wiki.gg/api.php'
          UA = 'LakwatchCreatureAssetBuilder/1.0 (personal app asset preparation)'
          session = requests.Session()
          session.headers.update({'User-Agent': UA, 'Accept': 'application/json,image/*,*/*;q=0.8'})

          def get_json(params, attempts=6):
              last = None
              for i in range(attempts):
                  try:
                      r = session.get(API, params=params, timeout=60)
                      r.raise_for_status()
                      return r.json()
                  except Exception as e:
                      last = e
                      time.sleep(min(10, 1.5 ** i))
              raise RuntimeError(f'ARK Wiki API failed: {last}')

          def category_files(root='Category:Creature icons'):
              todo = [root]
              seen = set()
              files = set()
              while todo:
                  cat = todo.pop()
                  if cat in seen:
                      continue
                  seen.add(cat)
                  cont = None
                  while True:
                      params = {
                          'action': 'query', 'format': 'json', 'formatversion': 2,
                          'list': 'categorymembers', 'cmtitle': cat,
                          'cmtype': 'file|subcat', 'cmlimit': 'max'
                      }
                      if cont:
                          params['cmcontinue'] = cont
                      data = get_json(params)
                      for item in data.get('query', {}).get('categorymembers', []):
                          title = item.get('title', '')
                          ns = item.get('ns')
                          if ns == 6 and title.startswith('File:'):
                              files.add(title)
                          elif ns == 14 and title.startswith('Category:'):
                              todo.append(title)
                      cont = data.get('continue', {}).get('cmcontinue')
                      if not cont:
                          break
              return sorted(files)

          def norm(s):
              s = s.replace('&', 'and')
              return re.sub(r'[^a-z0-9]+', '', s.lower())

          def clean_source_stem(filename):
              stem = filename[:-4]
              stem = re.sub(r'_ASA(?=$|_)', '', stem)
              stem = re.sub(r'_(?:sm|sf)(?=$|_)', '', stem)
              stem = re.sub(r'_p\d+(?=$|_)', '', stem)
              stem = re.sub(r'_v\d+(?=$|_)', '', stem)
              stem = re.sub(r'__+', '_', stem).strip('_ ')
              return stem

          def safe_filename(name):
              name = re.sub(r'[\\/:*?"<>|]+', '_', name).strip(' ._')
              return name or 'creature'

          def variants_for_match(stem):
              vals = {stem}
              swaps = {
                  'R-': 'R ', 'X-': 'X ', 'Tek ': 'Tek ',
                  'Aberrant ': 'Aberrant ', 'Corrupted ': 'Corrupted '
              }
              for a, b in swaps.items():
                  if stem.startswith(a):
                      vals.add(b + stem[len(a):])
              vals.add(stem.replace('R-', 'R '))
              vals.add(stem.replace('X-', 'X '))
              vals.add(stem.replace('Aberrant ', 'Aberrant'))
              vals.add(stem.replace('Tek ', 'Tek'))
              vals.add(stem.replace('Dire ', 'Dire'))
              aliases = {
                  'Archaeopteryx': ['Archaeopteryx'],
                  'Basilosaurus': ['Basilosaurus'],
                  'Coelacanth': ['Coelacanth'],
                  'Dire Bear': ['Direbear', 'Dire Bear'],
                  'Dung Beetle': ['Dung Beetle'],
                  'Giant Bee': ['Giant Bee'],
                  'Hesperornis': ['Hesperornis'],
                  'Karkinos': ['Karkinos'],
                  'Leedsichthys': ['Leedsichthys'],
                  'Liopleurodon': ['Liopleurodon'],
                  'Megapithecus': ['Megapithecus'],
                  'Megaloceros': ['Megaloceros'],
                  'Mesopithecus': ['Mesopithecus'],
                  'Microraptor': ['Microraptor'],
                  'Onyc': ['Onyc'],
                  'Pachyrhinosaurus': ['Pachyrhinosaurus'],
                  'Sabertooth Salmon': ['Sabertooth Salmon'],
                  'Terror Bird': ['Terror Bird'],
                  'Titanoboa': ['Titanoboa'],
                  'Tusoteuthis': ['Tusoteuthis'],
                  'Woolly Rhino': ['Woolly Rhino'],
              }
              vals.update(aliases.get(stem, []))
              return vals

          def fetch_imageinfo(titles):
              out = {}
              for i in range(0, len(titles), 40):
                  batch = titles[i:i+40]
                  data = get_json({
                      'action': 'query', 'format': 'json', 'formatversion': 2,
                      'prop': 'imageinfo', 'iiprop': 'url|mime|size',
                      'titles': '|'.join(batch)
                  })
                  for p in data.get('query', {}).get('pages', []):
                      ii = (p.get('imageinfo') or [{}])[0]
                      if ii.get('url'):
                          out[p.get('title')] = ii
              return out

          def download(url, attempts=6):
              last = None
              for i in range(attempts):
                  try:
                      r = session.get(url, timeout=90)
                      r.raise_for_status()
                      return r.content
                  except Exception as e:
                      last = e
                      time.sleep(min(10, 1.5 ** i))
              raise RuntimeError(f'Download failed {url}: {last}')

          def color_score(im):
              rgb = im.convert('RGB').resize((128, 128))
              hsv = rgb.convert('HSV')
              sat = ImageStat.Stat(hsv.getchannel('S')).mean[0] / 255.0
              return round(sat, 4)

          def palette_for(name):
              h = int(hashlib.sha256(name.encode()).hexdigest()[:8], 16)
              base = (h % 360) / 360.0
              hues = [base, (base + 0.10) % 1.0, (base + 0.52) % 1.0]
              cols = []
              for idx, hue in enumerate(hues):
                  sat = [0.55, 0.68, 0.42][idx]
                  val = [0.58, 0.82, 0.42][idx]
                  cols.append(tuple(round(c * 255) for c in colorsys.hsv_to_rgb(hue, sat, val)))
              return cols

          def colored_fallback(base_path, name):
              im = Image.open(base_path).convert('RGBA')
              alpha = im.getchannel('A')
              gray = ImageOps.grayscale(im)
              c1, c2, c3 = palette_for(name)
              colored = ImageOps.colorize(gray, black=c3, mid=c1, white=c2).convert('RGBA')
              # Preserve bright highlights without reverting to gray.
              colored = ImageEnhance.Color(colored).enhance(1.35)
              colored.putalpha(alpha)
              return colored

          def normalize_canvas(im):
              im = im.convert('RGBA')
              alpha = im.getchannel('A')
              bbox = alpha.getbbox()
              if bbox:
                  im = im.crop(bbox)
              im.thumbnail((464, 464), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
              canvas.alpha_composite(im, ((512-im.width)//2, (512-im.height)//2))
              return canvas

          manifest_data = json.loads((SRC / '_manifest.json').read_text(encoding='utf-8'))
          names = []
          for fn in manifest_data.get('files', {}):
              if not fn.endswith('.png') or fn.endswith('_m.png'):
                  continue
              if '_ASA' not in fn:
                  continue
              # Exclude files tied to a numeric CurseForge mod id rather than official ASA.
              if re.search(r'_\d{6,}(?:_|\.png)', fn):
                  continue
              names.append(fn)
          names = sorted(set(names), key=str.casefold)

          wiki_titles = category_files()
          wiki_stems = {}
          for title in wiki_titles:
              stem = Path(title[5:]).stem
              wiki_stems.setdefault(norm(stem), []).append(title)

          chosen = {}
          for source_fn in names:
              stem = clean_source_stem(source_fn)
              candidates = []
              for v in variants_for_match(stem):
                  candidates.extend(wiki_stems.get(norm(v), []))
              if candidates:
                  # Prefer PNG and the shortest exact-looking title.
                  candidates = sorted(set(candidates), key=lambda t: (not t.lower().endswith('.png'), len(t), t.casefold()))
                  chosen[source_fn] = candidates[0]

          info = fetch_imageinfo(sorted(set(chosen.values())))
          records = []
          unmatched = []
          used_out = set()

          for idx, source_fn in enumerate(names, 1):
              display = clean_source_stem(source_fn).replace('_', ' ')
              base_path = SRC / source_fn
              wiki_title = chosen.get(source_fn)
              source_url = None
              source_type = 'colorized_fallback'
              saturation = 0.0
              im = None
              error = None

              if wiki_title and wiki_title in info:
                  source_url = info[wiki_title]['url']
                  try:
                      raw = download(source_url)
                      test = Image.open(io.BytesIO(raw)).convert('RGBA')
                      saturation = color_score(test)
                      if saturation >= 0.055:
                          im = test
                          source_type = 'official_wiki_colored_icon'
                  except Exception as e:
                      error = str(e)

              if im is None:
                  im = colored_fallback(base_path, display)
                  saturation = color_score(im)
                  unmatched.append({
                      'display_name': display,
                      'source_filename': source_fn,
                      'wiki_candidate': wiki_title,
                      'reason': error or ('wiki image too desaturated' if wiki_title else 'no one-to-one wiki icon')
                  })

              canvas = normalize_canvas(im)
              out_name = safe_filename(Path(source_fn).stem.replace('_ASA', '')) + '.webp'
              if out_name.casefold() in used_out:
                  out_name = safe_filename(Path(source_fn).stem) + '.webp'
              used_out.add(out_name.casefold())
              out_path = OUT / out_name
              canvas.save(out_path, 'WEBP', lossless=True, method=6)
              records.append({
                  'display_name': display,
                  'file': f'creatures/{out_name}',
                  'source_filename': source_fn,
                  'source_type': source_type,
                  'wiki_file': wiki_title,
                  'source_url': source_url if source_type == 'official_wiki_colored_icon' else None,
                  'mean_saturation': saturation,
                  'size': [512, 512],
                  'transparent_background': True
              })
              print(f'[{idx:03d}/{len(names)}] {display}: {source_type} sat={saturation:.3f}')

          manifest = {
              'pack_name': 'Lakwatch ASA Colored Creature Assets',
              'generated_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'count': len(records),
              'scope': 'Official ASA-specific creatures and variants represented by arkutils/species-images',
              'format': '512x512 lossless WebP with transparent padding',
              'records': records
          }
          (OUT_ROOT / 'creature_manifest.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding='utf-8')
          (OUT_ROOT / 'wiki_unmatched_or_fallback.json').write_text(json.dumps(unmatched, indent=2, ensure_ascii=False), encoding='utf-8')
          summary = {
              'total': len(records),
              'official_wiki_colored': sum(r['source_type'] == 'official_wiki_colored_icon' for r in records),
              'colorized_fallback': sum(r['source_type'] == 'colorized_fallback' for r in records),
              'minimum_saturation': min((r['mean_saturation'] for r in records), default=0),
              'all_512_square': all(r['size'] == [512, 512] for r in records),
              'all_webp': all(r['file'].endswith('.webp') for r in records)
          }
          (OUT_ROOT / 'build_summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          (OUT_ROOT / 'ATTRIBUTION.md').write_text(
              '# Attribution and source notes\n\n'
              '- Colored creature icons: ARK Official Community Wiki, used as source/reference where a matching colored icon exists.\n'
              '- ASA creature/variant coverage and fallback silhouettes: `arkutils/species-images`, MIT licensed.\n'
              '- Fallback files were automatically colorized from the neutral ASB-compatible bases; they are identified in the manifest.\n'
              '- This pack is prepared for personal Lakwatch app development.\n',
              encoding='utf-8'
          )

          zip_path = ROOT / 'lakwatch_creature_assets_colored.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(OUT_ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(ROOT))
          print(json.dumps(summary, indent=2))
          print(f'ZIP={zip_path} bytes={zip_path.stat().st_size}')
          PY
          python build_assets.py

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lakwatch-creature-assets-colored
          path: lakwatch_creature_assets_colored.zip
          if-no-files-found: error
          retention-days: 1
